<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة الوزن والخصر</title>
<style>
  :root{
    --bg:#1B1F24;
    --panel:#232830;
    --ink:#E7EBEF;
    --dim:#8A94A0;
    --line:#333B45;
    --weight:#7FA9CE;
    --waist:#C9A227;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"SF Arabic","Segoe UI",system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
    padding:20px 16px 48px;
    max-width:560px;
    margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  h1{font-size:19px;font-weight:600;margin-bottom:2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}

  /* --- entry form --- */
  .entry{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:22px}
  .row{display:flex;gap:10px;margin-bottom:10px}
  .field{flex:1}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  input{
    width:100%;padding:12px 10px;border-radius:8px;
    border:1px solid var(--line);background:#1A1E23;color:var(--ink);
    font-size:17px;font-family:inherit;text-align:center;
  }
  input:focus{outline:2px solid var(--weight);outline-offset:1px;border-color:transparent}
  input[type=date]{font-size:14px;text-align:start}
  button{
    font-family:inherit;font-size:15px;cursor:pointer;
    border:none;border-radius:8px;padding:13px;width:100%;
    background:var(--weight);color:#12181E;font-weight:600;
  }
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* --- stats --- */
  .stats{display:flex;gap:10px;margin-bottom:18px}
  .stat{flex:1;background:var(--panel);border-radius:12px;padding:13px 12px}
  .stat .num{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat .cap{font-size:11px;color:var(--dim);margin-top:3px}

  /* --- chart --- */
  .chart{background:var(--panel);border-radius:12px;padding:14px 12px 8px;margin-bottom:14px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-bottom:10px;padding-inline-start:2px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
  svg{width:100%;height:auto;display:block;direction:ltr}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:36px 12px}

  /* --- footer actions --- */
  .acts{display:flex;gap:10px;margin-top:20px}
  .acts button{background:none;border:1px solid var(--line);color:var(--dim);font-size:12px;padding:11px 4px;font-weight:400}
  .note{color:var(--dim);font-size:12px;margin-top:16px;line-height:1.7}
</style>
</head>
<body>

<h1>الوزن والخصر</h1>
<p class="sub">رقم واحد باليوم. الخط هو الحقيقة، مو النقطة.</p>

<div class="entry">
  <div class="row">
    <div class="field">
      <label for="w">الوزن (كجم)</label>
      <input id="w" type="number" step="0.1" inputmode="decimal" placeholder="—">
    </div>
    <div class="field">
      <label for="c">الخصر (سم)</label>
      <input id="c" type="number" step="0.5" inputmode="decimal" placeholder="اختياري">
    </div>
  </div>
  <div class="row"><div class="field">
    <label for="d">التاريخ</label>
    <input id="d" type="date">
  </div></div>
  <button id="add">حفظ</button>
</div>

<div class="stats">
  <div class="stat"><div class="num" id="s1">—</div><div class="cap">متوسط ٧ أيام</div></div>
  <div class="stat"><div class="num" id="s2">—</div><div class="cap">كجم بالأسبوع</div></div>
  <div class="stat"><div class="num" id="s3">—</div><div class="cap">الخصر الآن</div></div>
</div>

<div class="chart">
  <div class="legend">
    <span><i style="background:var(--weight)"></i>الوزن</span>
    <span><i style="background:var(--waist)"></i>الخصر</span>
  </div>
  <div id="plot"><p class="empty">سجّل وزنك اليوم. الرسم يظهر بعد أول قياسين.</p></div>
</div>

<div class="acts">
  <button id="csv">تصدير CSV</button>
  <button id="imp">استيراد CSV</button>
  <button id="undo">حذف آخر</button>
</div>
<input id="file" type="file" accept=".csv,text/csv" hidden>

<p class="note">
  بياناتك محفوظة على جهازك فقط. ما تنرسل لأي سيرفر.<br>
  صدّر CSV كل شهرين — احتياط لو ضاع الجهاز.
</p>

<script>
// ---- storage: artifact API when available, localStorage otherwise ----
const KEY = 'gym_body_log';

async function load(){
  try{
    if(window.storage){
      const r = await window.storage.get(KEY, false);
      return r && r.value ? JSON.parse(r.value) : [];
    }
    return JSON.parse(localStorage.getItem(KEY) || '[]');
  }catch(e){ return []; }
}

async function save(rows){
  try{
    const s = JSON.stringify(rows);
    if(window.storage) await window.storage.set(KEY, s, false);
    else localStorage.setItem(KEY, s);
    return true;
  }catch(e){ return false; }
}

let rows = [];   // [{d:'YYYY-MM-DD', w:Number, c:Number|null}]

const $ = id => document.getElementById(id);
const today = () => new Date().toISOString().slice(0,10);
const days = s => Math.round(new Date(s+'T00:00:00Z').getTime() / 86400000);

// ---- 7-day trailing average: hides daily water/food noise ----
function trend(rows){
  return rows.map(r => {
    const from = days(r.d) - 6;
    const win = rows.filter(x => days(x.d) >= from && days(x.d) <= days(r.d));
    return { d: r.d, v: win.reduce((a,x) => a + x.w, 0) / win.length };
  });
}

// ---- weekly rate from a least-squares fit over the last 21 days ----
function rate(t){
  const cut = days(t[t.length-1].d) - 20;
  const pts = t.filter(p => days(p.d) >= cut);
  if(pts.length < 4) return null;
  const xs = pts.map(p => days(p.d)), ys = pts.map(p => p.v);
  const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0, den=0;
  xs.forEach((x,i) => { num += (x-mx)*(ys[i]-my); den += (x-mx)**2; });
  return den ? (num/den)*7 : null;
}

function polyline(pts, W, H, pad, xMin, xSpan, yMin, ySpan){
  return pts.map(p => {
    const x = pad + ((p.x - xMin) / xSpan) * (W - pad*2);
    const y = H - pad - ((p.y - yMin) / ySpan) * (H - pad*2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

function draw(){
  const plot = $('plot');
  if(rows.length < 2){
    plot.innerHTML = '<p class="empty">سجّل وزنك اليوم. الرسم يظهر بعد أول قياسين.</p>';
    return;
  }

  const W = 340, H = 200, pad = 26;
  const t = trend(rows);
  const waist = rows.filter(r => r.c != null);

  const xMin = days(rows[0].d);
  const xSpan = Math.max(1, days(rows[rows.length-1].d) - xMin);

  // weight axis padded 3% so the line never touches the frame
  const ws = rows.map(r=>r.w).concat(t.map(p=>p.v));
  let yMin = Math.min(...ws), yMax = Math.max(...ws);
  const padY = Math.max(0.4, (yMax-yMin)*0.15);
  yMin -= padY; yMax += padY;
  const ySpan = yMax - yMin;

  const px = d => pad + ((days(d)-xMin)/xSpan)*(W-pad*2);
  const py = v => H - pad - ((v-yMin)/ySpan)*(H-pad*2);

  // raw daily readings as faint dots
  const dots = rows.map(r =>
    `<circle cx="${px(r.d).toFixed(1)}" cy="${py(r.w).toFixed(1)}" r="2.2" fill="var(--weight)" opacity=".3"/>`
  ).join('');

  const line = `<polyline fill="none" stroke="var(--weight)" stroke-width="2.2"
    stroke-linejoin="round" stroke-linecap="round"
    points="${polyline(t.map(p=>({x:days(p.d),y:p.v})), W,H,pad, xMin,xSpan, yMin,ySpan)}"/>`;

  // waist gets its own scale on the right — different unit, same time axis
  let waistLine = '';
  if(waist.length > 1){
    const cs = waist.map(r=>r.c);
    let cMin = Math.min(...cs), cMax = Math.max(...cs);
    const cPad = Math.max(0.5, (cMax-cMin)*0.15);
    cMin -= cPad; cMax += cPad;
    waistLine = `<polyline fill="none" stroke="var(--waist)" stroke-width="2" stroke-dasharray="4 3"
      stroke-linejoin="round" points="${polyline(waist.map(r=>({x:days(r.d),y:r.c})), W,H,pad, xMin,xSpan, cMin, cMax-cMin)}"/>`;
  }

  plot.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى الوزن والخصر">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    <text x="${pad-4}" y="${py(yMax-padY).toFixed(1)}" fill="var(--dim)" font-size="9"
      text-anchor="end" dominant-baseline="middle">${(yMax-padY).toFixed(1)}</text>
    <text x="${pad-4}" y="${py(yMin+padY).toFixed(1)}" fill="var(--dim)" font-size="9"
      text-anchor="end" dominant-baseline="middle">${(yMin+padY).toFixed(1)}</text>
    ${dots}${waistLine}${line}
  </svg>`;
}

function render(){
  rows.sort((a,b) => a.d.localeCompare(b.d));

  if(rows.length){
    const t = trend(rows);
    $('s1').textContent = t[t.length-1].v.toFixed(1);
    const r = rate(t);
    $('s2').textContent = r === null ? '—' : (r > 0 ? '+' : '') + r.toFixed(2);
    const lastWaist = [...rows].reverse().find(x => x.c != null);
    $('s3').textContent = lastWaist ? lastWaist.c : '—';
  }
  draw();
}

$('add').onclick = async () => {
  const w = parseFloat($('w').value);
  const c = $('c').value === '' ? null : parseFloat($('c').value);
  const d = $('d').value || today();

  if(!isFinite(w) || w <= 20 || w > 400){ alert('اكتب وزن صحيح بالكيلو.'); return; }
  if(c !== null && (!isFinite(c) || c < 40 || c > 250)){ alert('اكتب خصر صحيح بالسنتيمتر.'); return; }

  const i = rows.findIndex(r => r.d === d);
  if(i >= 0) rows[i] = { d, w, c: c !== null ? c : rows[i].c };
  else rows.push({ d, w, c });

  if(!await save(rows)){ alert('ما انحفظ. جرب مرة ثانية.'); return; }
  $('w').value = ''; $('c').value = '';
  render();
};

$('undo').onclick = async () => {
  if(!rows.length) return;
  if(!confirm('حذف إدخال ' + rows[rows.length-1].d + '؟')) return;
  rows.pop();
  await save(rows);
  render();
};

$('csv').onclick = () => {
  const csv = 'date,weight_kg,waist_cm\n' +
    rows.map(r => `${r.d},${r.w},${r.c ?? ''}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'body-log.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---- import merges by date: existing days win, so re-importing is safe ----
$('imp').onclick = () => $('file').click();

$('file').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  const lines = (await f.text()).trim().split(/\r?\n/);
  const seen = new Set(rows.map(r => r.d));
  let added = 0;

  for(const ln of lines){
    const [d, w, c] = ln.split(',').map(s => s.trim());
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d) || seen.has(d)) continue;
    const wn = parseFloat(w), cn = parseFloat(c);
    if(!isFinite(wn) || wn <= 20 || wn > 400) continue;
    rows.push({ d, w: wn, c: isFinite(cn) ? cn : null });
    seen.add(d);
    added++;
  }

  e.target.value = '';
  if(!added){ alert('ما فيه صفوف جديدة.'); return; }
  await save(rows);
  render();
  alert('أُضيف ' + added + ' يوم.');
};

(async () => {
  $('d').value = today();
  rows = await load();
  render();
})();
</script>
</body>
</html>
